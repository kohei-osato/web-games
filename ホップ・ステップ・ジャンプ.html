<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ホップ・ステップ・ジャンプ</title>
<style>
:root{--bg:#f3efe6;--fg:#222;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b19;--fg:#f1ede4}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Yu Gothic",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:manipulation;user-select:none}
h1{font-size:17px;margin:6px 0}
#wrap{position:relative;width:min(96vw,640px);aspect-ratio:16/9}
canvas{width:100%;height:100%;border-radius:12px;display:block}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.6);border-radius:12px;color:#fff;text-align:center;padding:12px}
#ov h2{font-size:24px;margin:0 0 6px}
#ov p{margin:4px 0 12px;font-size:14px;line-height:1.6}
button{font:inherit;font-size:18px;padding:10px 28px;border:0;border-radius:24px;background:#e8453c;color:#fff;cursor:pointer}
small{opacity:.7;margin-top:6px}
</style>
</head>
<body>
<h1>ホップ・ステップ・ジャンプ</h1>
<div id="wrap">
<canvas id="c" width="640" height="360"></canvas>
<div id="ov"><h2>三段跳び</h2><p><b>ホップ</b>：バーが一番上のときにクリック<br><b>ステップ</b>：円の緑の位置でクリック<br><b>ジャンプ</b>：縮むリングが金の輪に重なったらクリック<br>（ベストなら最大100mの超ロングジャンプ！）</p><button id="go">スタート</button></div>
</div>
<small>マウスクリック / タップ / スペースキー</small>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
const W=640,H=360,GY=280,SC=30,PI=Math.PI;
let zLast=0,bT=0;let ph='ready',pt=0,tm=0,ax=-6,x0=0,D=0,T=1,HG=0,rec=[],d1=0,d2=0,d3=0,mult=1,best=0,msg='',msgT=0,last=0,run=false,v1=0;
function start(){ph='run';pt=0;ax=-6;rec=[];msg='';ov.style.display='none';if(!run){run=true;last=performance.now();requestAnimationFrame(loop)}}
document.getElementById('go').onclick=start;
function set(p){ph=p;pt=0}
function launch(d,t,h){x0=ax;D=d;T=t;HG=h;set('a'+ph[1])}
function say(s){msg=s;msgT=1.1}
function click(){
  if(ph==='g1'){
    const f=(pt*1.5)%2,v=f<1?f:2-f;
    d1=2+3*v;say(v>.9?'PERFECT!':v>.6?'GOOD':'MISS');launch(d1,.8,40+70*v);
  }else if(ph==='g2'){
    const a=(pt*1.3*2*PI+PI)%(2*PI),df=a>PI?2*PI-a:a,p=Math.max(0,1-df/1.2);
    d2=1.5+2.5*p;say(p>.9?'PERFECT!':p>.5?'GOOD':'MISS');launch(d2,.8,35+90*p);
  }else if(ph==='g3'){
    const r=Math.max(0,140*(1-pt/2.4)),e=Math.abs(r-30);
    mult=Math.min(5,Math.max(1,5.4-e/8));
    d3=1+(mult-1)*24.75;say('×'+mult.toFixed(1)+(mult>=4.9?' PERFECT!':''));launch(d3,1.4+d3/50,60+d3*.8);
  }
}
cv.addEventListener('pointerdown',click);
addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();click()}});
function loop(n){
  const dt=Math.min((n-last)/1000,.05);last=n;pt+=dt;tm+=dt;if(msgT>0)msgT-=dt;bT-=dt;
  if(ph==='run'){const u=Math.min(1,pt/1.6);ax=-6+6*u*u;if(pt>=1.6){ax=0;set('g1')}}
  else if(ph==='g3'&&pt>=2.4)click();
  else if(ph[0]==='a'){
    const u=Math.min(1,pt/T);ax=x0+D*u;
    if(u>=1){rec.push(ax);set(ph==='a1'?'g2':ph==='a2'?'g3':'end')}
  }else if(ph==='end'&&pt>1.2){finish();draw();return}
  draw();requestAnimationFrame(loop);
}
function finish(){
  run=false;const tot=ax;const nb=tot>best;if(nb)best=tot;
  const r=tot>=90?'伝説の大ジャンプ！':tot>=60?'超人級！':tot>=30?'好記録！':tot>=12?'まずまず':'練習あるのみ';
  ov.style.display='flex';
  ov.innerHTML='<h2>'+tot.toFixed(2)+' m</h2><p>'+r+(nb?' 🏅ベスト更新！':'')+'<br>ホップ '+d1.toFixed(1)+'m / ステップ '+d2.toFixed(1)+'m / ジャンプ '+d3.toFixed(1)+'m（×'+mult.toFixed(1)+'）<br>ベスト '+best.toFixed(2)+' m</p><button id="go2">もう一回</button>';
  document.getElementById('go2').onclick=start;
}
const Z=[['#8ec5ff','#e6f3ff','#c0603a'],['#a8dcff','#ffeef5','#c9714a'],['#9fd8a8','#e9f7d6','#6a8f4a'],['#5fb4e8','#d8f1ff','#e8d49a'],['#ff9a5a','#ffe0a0','#8a5a4a'],['#6fb7ff','#f4fbff','#7a8f5a'],['#f4c76a','#ffefc0','#d9b26a'],['#10153a','#3a3f7a','#3a3a55'],['#0a2a3a','#2a6a7a','#dfeaf2'],['#1a0a2e','#7a2a8a','#2a2a3a'],['#7ec8ff','#fff1d8','#8aa0a8'],['#000008','#101040','#888890']];
const ZN=['競技場','桜並木','森','海辺','夕焼けの街','富士山','砂漠','夜空','オーロラ雪原','ネオンの街','自由の女神','宇宙'];
function zoneOf(){return Math.min(11,Math.floor(Math.max(0,ax)/10))}
function rnd(k){return Math.abs(Math.sin(k*12.9898)*43758.5453)%1}
function par(cam,f,p,fn){const k0=Math.floor(cam*f/p),o=-(cam*f-k0*p);for(let i=-1;i<=W/p+1;i++)fn(o+i*p,rnd(k0+i))}
function scene(z,cam){
  const c=ctx;
  const tri=(x,w,h,col)=>{c.fillStyle=col;c.beginPath();c.moveTo(x-w,GY);c.lineTo(x,GY-h);c.lineTo(x+w,GY);c.fill()};
  if(z===0){c.fillStyle='#6b7a8f';c.fillRect(0,150,W,GY-150)}
  else if(z===1)par(cam,.5,90,(x,r)=>{c.fillStyle='#7a4a2a';c.fillRect(x-4,GY-50,8,50);c.fillStyle=r>.5?'#ffb3cc':'#ff95b8';c.beginPath();c.arc(x,GY-62,30+r*14,0,7);c.fill()});
  else if(z===2)par(cam,.5,60,(x,r)=>tri(x,26+r*14,70+r*70,r>.5?'#2f6b3a':'#3f8a4a'));
  else if(z===3){c.fillStyle='#ffe27a';c.beginPath();c.arc(480,120,34,0,7);c.fill();c.fillStyle='#2f7fc0';c.fillRect(0,GY-70,W,70);c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=2;par(cam,.6,70,(x,r)=>{c.beginPath();c.moveTo(x,GY-50+r*30);c.lineTo(x+30,GY-50+r*30);c.stroke()})}
  else if(z===4){c.fillStyle='#ffd27a';c.beginPath();c.arc(120,GY-70,50,0,7);c.fill();par(cam,.4,48,(x,r)=>{c.fillStyle=r>.5?'#6a3a3a':'#8a4a4a';c.fillRect(x-20,GY-40-r*100,40,40+r*100)})}
  else if(z===5){par(cam,.2,160,(x,r)=>tri(x,110,40+r*30,'#5a8f5a'));const fx=380+(55-ax)*9;tri(fx,150,170,'#4a6fa5');c.fillStyle='#fff';c.beginPath();c.moveTo(fx-46,GY-118);c.lineTo(fx,GY-170);c.lineTo(fx+46,GY-118);c.lineTo(fx+25,GY-126);c.lineTo(fx+10,GY-112);c.lineTo(fx-12,GY-126);c.fill()}
  else if(z===6){c.fillStyle='#fff3a0';c.beginPath();c.arc(500,80,40,0,7);c.fill();par(cam,.3,220,(x,r)=>tri(x,70+r*50,90+r*60,'#c9a050'))}
  else if(z===7){c.fillStyle='#fff';par(cam,.1,40,(x,r)=>c.fillRect(x,10+r*130,2,2));c.fillStyle='#fff7c0';c.beginPath();c.arc(500,70,24,0,7);c.fill();par(cam,.4,50,(x,r)=>{c.fillStyle='#1a1a30';c.fillRect(x-18,GY-40-r*80,36,40+r*80)})}
  else if(z===8){par(cam,.1,100,(x,r)=>{c.fillStyle='rgba(90,255,190,.25)';c.fillRect(x,20,70,100+r*60)});par(cam,.3,150,(x,r)=>tri(x,90,70+r*60,'#e8f2ff'))}
  else if(z===9){par(cam,.4,44,(x,r)=>{c.fillStyle='#14102a';c.fillRect(x-18,GY-60-r*110,36,60+r*110);c.fillStyle=['#ff4fd8','#4ff0ff','#ffe84f'][(r*30|0)%3];for(let y=GY-50-r*110;y<GY-8;y+=14){c.fillRect(x-10,y,6,6);c.fillRect(x+4,y,6,6)}})}
  else if(z===10){c.fillStyle='#3a8fd0';c.fillRect(0,GY-50,W,50);const lx=380+(105-ax)*9;c.fillStyle='#9a9a9a';c.fillRect(lx-26,GY-70,52,70);c.fillStyle='#6fc7b0';c.fillRect(lx-14,GY-150,28,80);c.beginPath();c.arc(lx,GY-160,13,0,7);c.fill();c.fillRect(lx+8,GY-190,6,40);for(let i=-2;i<=2;i++)c.fillRect(lx+i*5-1,GY-182,2,10);c.fillStyle='#ffd34d';c.beginPath();c.arc(lx+11,GY-196,8,0,7);c.fill()}
  else{c.fillStyle='#fff';par(cam,.1,30,(x,r)=>c.fillRect(x,6+r*200,2,2));c.fillStyle='#c0603a';c.beginPath();c.arc(420-(ax-110)*3,110,50,0,7);c.fill();c.strokeStyle='#e8c090';c.lineWidth=4;c.beginPath();c.ellipse(420-(ax-110)*3,110,80,14,-.3,0,7);c.stroke()}
}
function athlete(x,y,air){
  const a=air?.9:Math.sin(tm*14)*.9,hy=y-34,sy=y-62;
  ctx.lineCap='round';ctx.lineWidth=7;ctx.strokeStyle='#222';
  const leg=(an)=>{ctx.beginPath();ctx.moveTo(x,hy);ctx.lineTo(x+Math.sin(an)*24,hy+Math.cos(an)*32);ctx.stroke()};
  leg(a);leg(air?-.5:-a);
  ctx.strokeStyle='#e8453c';ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(x,hy);ctx.lineTo(x,sy);ctx.stroke();
  ctx.strokeStyle='#222';ctx.lineWidth=5;
  const arm=(an)=>{ctx.beginPath();ctx.moveTo(x,sy+2);ctx.lineTo(x+Math.sin(an)*20,sy+2+Math.cos(an)*(air?-22:22));ctx.stroke()};
  arm(air?.6:-a);arm(air?-.6:a);
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,sy-11,9,0,7);ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(x-9,sy-21,18,5);
}
function draw(){
  const g=ctx.createLinearGradient(0,0,0,GY);const zn=zoneOf();g.addColorStop(0,Z[zn][0]);g.addColorStop(1,Z[zn][1]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const cam=ax*SC-120;
  scene(zn,cam);
  const off=-(cam*.3)%14;
  for(let x=off;x<W;x+=14)if(zn===0)for(let y=158;y<GY-6;y+=12){ctx.fillStyle=((x+y)|0)%3?'#aab4c4':'#e8c35a';ctx.fillRect(x,y,6,6)}
  ctx.fillStyle=Z[zn][2];ctx.fillRect(0,GY,W,H-GY);
  if(rec.length>=2){ctx.fillStyle='#e8d49a';ctx.fillRect(rec[1]*SC-cam,GY,900,H-GY)}
  ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;
  for(const y of [GY+22,GY+46]){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  ctx.font='11px sans-serif';ctx.textAlign='center';
  for(let m=Math.floor(cam/SC)-1;m<=Math.ceil((cam+W)/SC);m++){
    if(m<0)continue;const x=m*SC-cam;
    ctx.fillStyle='#fff';ctx.fillRect(x,GY,2,m%5?5:12);
    if(m%5===0)ctx.fillText(m+'m',x,GY+26);
  }
  ctx.fillStyle='#fff';ctx.fillRect(-cam-6,GY-2,12,6);
  rec.forEach((r,i)=>{const x=r*SC-cam;ctx.fillStyle='#fff';ctx.fillRect(x,GY-26,2,26);
    ctx.fillStyle='#e8453c';ctx.beginPath();ctx.moveTo(x+2,GY-26);ctx.lineTo(x+22,GY-20);ctx.lineTo(x+2,GY-14);ctx.fill();
    ctx.fillStyle='#222';ctx.font='bold 12px sans-serif';ctx.fillText(['ホップ','ステップ','ジャンプ'][i]+' '+(i?r-rec[i-1]:r).toFixed(1)+'m',x+10,GY-32)});
  let u=0,yo=0,air=ph[0]==='a';
  if(air){u=Math.min(1,pt/T);yo=HG*Math.sin(PI*u)}
  if(ph==='a3'){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;for(let i=0;i<Math.min(30,D/3);i++){const y=Math.random()*GY,l=60+Math.random()*240,x=Math.random()*W;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-l,y);ctx.stroke()}}
  const sx=120;
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(sx,GY+4,16-yo/12,4,0,0,7);ctx.fill();
  athlete(sx,GY-yo,air);
  // HUD
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(8,8,150,30);
  ctx.fillStyle='#fff';ctx.font='bold 18px sans-serif';ctx.textAlign='left';
  ctx.fillText('記録 '+Math.max(0,ax).toFixed(2)+' m',16,29);
  ctx.textAlign='right';ctx.font='12px sans-serif';ctx.fillStyle='#222';ctx.fillText('ベスト '+best.toFixed(2)+' m',W-10,20);
  ctx.textAlign='center';ctx.font='bold 16px sans-serif';ctx.fillStyle='#222';
  const title={g1:'ホップ！ バーがMAXのときにクリック',g2:'ステップ！ 緑のゾーンでクリック',g3:'最終ジャンプ！ 金の輪に重なれ（最大100m！）'}[ph];
  if(title)ctx.fillText(title,W/2,60);
  // gauges
  if(ph==='g1'){
    const f=(pt*1.5)%2,v=f<1?f:2-f,bx=560,by=90,bh=170;
    ctx.fillStyle='#222';ctx.fillRect(bx,by,28,bh);
    const gg=ctx.createLinearGradient(0,by+bh,0,by);gg.addColorStop(0,'#3a7bd5');gg.addColorStop(.6,'#f0c030');gg.addColorStop(1,'#e8453c');
    ctx.fillStyle=gg;ctx.fillRect(bx+3,by+bh-3-(bh-6)*v,22,(bh-6)*v);
    ctx.fillStyle='#fff';ctx.fillRect(bx-6,by+bh-3-(bh-6)*v-2,40,4);
    ctx.fillStyle='#222';ctx.font='bold 13px sans-serif';ctx.fillText('MAX',bx+14,by-6);
  }
  if(ph==='g2'){
    const cx=560,cy=150,r=52,th=pt*1.3*2*PI+PI;
    ctx.lineWidth=14;ctx.strokeStyle='#222';ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();
    ctx.strokeStyle='#38c172';ctx.beginPath();ctx.arc(cx,cy,r,-PI/2-.3,-PI/2+.3);ctx.stroke();
    ctx.strokeStyle='#bfe9cf';ctx.lineWidth=6;ctx.beginPath();ctx.arc(cx,cy,r,-PI/2-.1,-PI/2+.1);ctx.stroke();
    ctx.fillStyle='#e8453c';ctx.beginPath();ctx.arc(cx+Math.sin(th)*r,cy-Math.cos(th)*r,10,0,7);ctx.fill();
  }
  if(ph==='g3'){
    const cx=W/2,cy=150,r=Math.max(0,140*(1-pt/2.4));
    ctx.lineWidth=6;ctx.strokeStyle='#ffd34d';ctx.beginPath();ctx.arc(cx,cy,30,0,7);ctx.stroke();
    ctx.strokeStyle=Math.abs(r-30)<10?'#38c172':'#fff';ctx.lineWidth=5;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();
    ctx.fillStyle='#222';ctx.font='bold 13px sans-serif';ctx.fillText('倍率 ×1〜×5',cx,cy+4);
  }
  if(zn!==zLast){zLast=zn;bT=1.8}
  if(bT>0){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(8,44,210,26);ctx.fillStyle='#fff';ctx.font='bold 16px sans-serif';ctx.textAlign='left';ctx.fillText(zn*10+'m '+ZN[zn],16,63)}
  if(msgT>0){ctx.font='bold 40px sans-serif';ctx.fillStyle='#e8453c';ctx.strokeStyle='#fff';ctx.lineWidth=5;
    ctx.strokeText(msg,W/2,120);ctx.fillText(msg,W/2,120)}
}
draw();
</script>
</body>
</html>
